authors = [
    {name = "Daniel Rojas",email = "daarojaspa@unal.edu.co"}
]
license = {text = "IMT"}
requires-python = ">=3.12"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "pandas (>=3.0.1,<4.0.0)",
    "lxml (>=6.0.2,<7.0.0)",
    "playwright (>=1.58.0,<2.0.0)",
    "scrapy (>=2.14.1,<3.0.0)",
    "docker (>=7.1.0,<8.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "jupyterlab (>=4.5.5,<5.0.0)",
    "curl-cffi (>=0.14.0,<0.15.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
